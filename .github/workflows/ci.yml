name: 🧪 Continuous Integration & Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend API & Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend Test Suite
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_32char
          FRONTEND_URL: http://localhost:3000
          ROOT_DOMAIN: go-live.me
          CLOUDFLARE_API_TOKEN: test_dummy_token
          CLOUDFLARE_ZONE_ID: test_dummy_zone
        run: npm test

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go-live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: go-live/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Next.js Production Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FRONTEND_URL: https://go-live.me
          ROOT_DOMAIN: go-live.me
        run: npm run build

      - name: Run Frontend Unit Tests
        run: node --test tests/domain-service.test.mjs tests/api-client.test.mjs tests/security-headers.test.mjs
