<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background & Dot Grid -->
  <rect width="1200" height="630" rx="16" fill="#F4F5F3" />
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#DADDD6" />
    </pattern>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4DFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1B4DFF" stop-opacity="0" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1200" height="630" rx="16" fill="url(#dotGrid)" />
  <circle cx="200" cy="150" r="350" fill="url(#blueGlow)" />

  <!-- Browser Container Mockup Frame -->
  <g transform="translate(60, 45)">
    <!-- Main Window Background -->
    <rect width="1080" height="540" rx="16" fill="#FFFFFF" stroke="#DADDD6" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Window Titlebar -->
    <path d="M0 16C0 7.16344 7.16344 0 16 0H1064C1072.84 0 1080 7.16344 1080 16V48H0V16Z" fill="#F8F9FA" stroke="#DADDD6" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="6" fill="#FF5F56" />
    <circle cx="44" cy="24" r="6" fill="#FFBD2E" />
    <circle cx="64" cy="24" r="6" fill="#27C93F" />

    <!-- Browser Address Bar -->
    <rect x="240" y="10" width="600" height="28" rx="6" fill="#FFFFFF" stroke="#DADDD6" stroke-width="1" />
    <text x="540" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#5E6668" text-anchor="middle">
      🔒 https://go-live.me
    </text>

    <!-- App Top Bar Inside Browser -->
    <g transform="translate(40, 75)">
      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#1B4DFF">▲</text>
      <text x="28" y="24" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#14181B">Go-Live</text>
      <text x="132" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#DADDD6">/</text>
      <text x="148" y="24" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#5E6668">go-live.me</text>

      <!-- Anycast Status Pill -->
      <rect x="740" y="2" width="260" height="30" rx="15" fill="#F4F5F3" stroke="#DADDD6" stroke-width="1.5" />
      <circle cx="756" cy="17" r="4.5" fill="#059669" />
      <text x="768" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#059669">
        Anycast DNS Online · 300+ PoPs
      </text>
    </g>

    <!-- Main Content Area Grid -->
    <g transform="translate(40, 145)">
      <!-- Left Column: Search & Claim -->
      <g transform="translate(0, 10)">
        <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" fill="#14181B" letter-spacing="-1">
          Go-Live
        </text>
        <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#5E6668">
          Your site. Your subdomain. Live. Get a free developer subdomain in seconds.
        </text>

        <!-- Search Card Box -->
        <g transform="translate(0, 100)">
          <rect width="560" height="96" rx="12" fill="#FFFFFF" stroke="#DADDD6" stroke-width="1.5" filter="url(#cardShadow)" />
          
          <!-- Subdomain text with signature blue underline -->
          <text x="24" y="44" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#14181B">
            works-on-my-machine
          </text>
          <line x1="24" y1="52" x2="315" y2="52" stroke="#1B4DFF" stroke-width="3.5" stroke-linecap="round" />
          
          <text x="320" y="44" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" fill="#5E6668" opacity="0.65">
            .go-live.me
          </text>

          <!-- Claim Button -->
          <rect x="430" y="16" width="112" height="42" rx="10" fill="#1B4DFF" />
          <text x="486" y="42" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
            Claim →
          </text>

          <!-- Status Green Pill -->
          <circle cx="30" cy="74" r="4" fill="#059669" />
          <text x="42" y="78" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#059669">
            works-on-my-machine.go-live.me is available!
          </text>
        </g>

        <!-- Dev Favorites Bar -->
        <g transform="translate(0, 220)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#14181B">⚡ Dev favorites:</text>
          <text x="120" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#1B4DFF">portfolio</text>
          <text x="195" y="14" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5E6668">·</text>
          <text x="210" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#1B4DFF">ai-agent</text>
          <text x="280" y="14" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5E6668">·</text>
          <text x="295" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#1B4DFF">docs</text>
          <text x="340" y="14" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5E6668">·</text>
          <text x="355" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#1B4DFF">preview</text>
        </g>
      </g>

      <!-- Right Column: 3D Orbit Globe Card -->
      <g transform="translate(620, 0)">
        <rect width="380" height="260" rx="16" fill="#F8F9FA" stroke="#DADDD6" stroke-width="1.5" />
        
        <!-- Header inside card -->
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#5E6668">
          GLOBAL ANYCAST PROBE
        </text>
        <circle cx="334" cy="28" r="4" fill="#059669" />
        <text x="344" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">
          LIVE
        </text>

        <!-- Orbit Graphic -->
        <g transform="translate(190, 115)">
          <ellipse cx="0" cy="0" rx="75" ry="75" stroke="#1B4DFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
          <ellipse cx="0" cy="0" rx="85" ry="35" stroke="#1B4DFF" stroke-width="1" opacity="0.3" transform="rotate(-25)" />
          
          <!-- Central Globe Node -->
          <circle cx="0" cy="0" r="42" fill="#1B4DFF" fill-opacity="0.08" stroke="#1B4DFF" stroke-width="1.5" />
          <text x="0" y="11" font-size="32" text-anchor="middle">🌐</text>
          
          <!-- Orbiting Nodes -->
          <circle cx="55" cy="-50" r="6" fill="#059669" />
          <circle cx="-65" cy="35" r="5" fill="#1B4DFF" />
          <circle cx="70" cy="20" r="4" fill="#FFBD2E" />
        </g>

        <!-- Metrics Footer -->
        <line x1="20" y1="200" x2="360" y2="200" stroke="#DADDD6" stroke-width="1" />
        <g transform="translate(24, 235)">
          <text x="25" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#14181B" text-anchor="middle">&lt;30ms</text>
          <text x="25" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5E6668" text-anchor="middle">Global Latency</text>

          <line x1="95" y1="-12" x2="95" y2="15" stroke="#DADDD6" stroke-width="1" />

          <text x="165" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#14181B" text-anchor="middle">300+ PoPs</text>
          <text x="165" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5E6668" text-anchor="middle">Edge Locations</text>

          <line x1="240" y1="-12" x2="240" y2="15" stroke="#DADDD6" stroke-width="1" />

          <text x="295" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#059669" text-anchor="middle">100%</text>
          <text x="295" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5E6668" text-anchor="middle">Anycast Uptime</text>
        </g>
      </g>
    </g>

    <!-- Window Footer Bar -->
    <g transform="translate(40, 485)">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#DADDD6" stroke-width="1" />
      <g transform="translate(0, 26)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#14181B">▲ 1-Click Vercel</text>
        <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#14181B">🐙 1-Click GitHub Pages</text>
        <text x="365" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#14181B">⚡ 1-Click Render</text>
        <text x="540" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#14181B">🔒 Universal TLS 1.3</text>
        <text x="740" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#059669">⭐ Free Forever via GitHub</text>
      </g>
    </g>
  </g>
</svg>
