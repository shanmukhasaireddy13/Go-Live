<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm Dark Background -->
  <rect width="1200" height="630" rx="16" fill="#18140F" />
  
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Blue/Warm Glow behind Globe -->
  <circle cx="950" cy="300" r="180" fill="#1B4DFF" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Main Grid Layout -->
  <g transform="translate(80, 110)">
    <!-- Left Column: Title, Subtitle, Search Console -->
    <g transform="translate(0, 30)">
      <!-- Main Title -->
      <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="64" font-weight="900" fill="#EFE7D9" letter-spacing="-1.5">
        Go-Live
      </text>

      <!-- Subtitle -->
      <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#A89C89" font-weight="400">
        Your site. Your subdomain. Live. Get a free developer subdomain and connect your
      </text>
      <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#A89C89" font-weight="400">
        project in seconds.
      </text>

      <!-- Signature Search Bar -->
      <g transform="translate(0, 190)">
        <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="900" fill="#A89C89" opacity="0.4">|</text>
        
        <!-- Underlined Subdomain Text -->
        <text x="16" y="38" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="900" fill="#EFE7D9">
          works-on-my-machine
        </text>
        <line x1="16" y1="48" x2="435" y2="48" stroke="#8399FF" stroke-width="4" stroke-linecap="round" />
        
        <text x="444" y="38" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="900" fill="#A89C89">
          .go-live.me
        </text>
      </g>

      <!-- Dev Favorites Line -->
      <g transform="translate(0, 275)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#D97757">✨</text>
        <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#A89C89">
          Dev favorites: portfolio works-on-my-machine my-app still-compiling ai-agent
        </text>
      </g>
    </g>

    <!-- Right Column: 3D Orbit Dot Globe -->
    <g transform="translate(680, 10)">
      <!-- Outer Orbit Ellipse -->
      <ellipse cx="180" cy="180" rx="175" ry="58" transform="rotate(-18 180 180)" fill="none" stroke="#A89C89" stroke-width="1.2" opacity="0.3" />

      <!-- Fibonacci Dotted Sphere Representation -->
      <g fill="#8399FF">
        <!-- Center clusters -->
        <circle cx="180" cy="180" r="2.8" opacity="0.9" />
        <circle cx="195" cy="170" r="3.0" opacity="0.95" />
        <circle cx="165" cy="190" r="2.5" opacity="0.85" />
        <circle cx="170" cy="160" r="2.6" opacity="0.8" />
        <circle cx="190" cy="198" r="2.9" opacity="0.9" />
        <circle cx="210" cy="182" r="2.7" opacity="0.85" />
        <circle cx="150" cy="175" r="2.4" opacity="0.75" />
        
        <!-- Mid shell points -->
        <circle cx="215" cy="155" r="2.5" opacity="0.8" />
        <circle cx="145" cy="205" r="2.3" opacity="0.7" />
        <circle cx="205" cy="215" r="2.4" opacity="0.75" />
        <circle cx="155" cy="145" r="2.2" opacity="0.7" />
        <circle cx="230" cy="175" r="2.4" opacity="0.75" />
        <circle cx="130" cy="185" r="2.0" opacity="0.65" />
        <circle cx="185" cy="135" r="2.3" opacity="0.7" />
        <circle cx="175" cy="225" r="2.5" opacity="0.75" />

        <!-- Outer shell points -->
        <circle cx="240" cy="150" r="2.0" opacity="0.6" />
        <circle cx="120" cy="210" r="1.8" opacity="0.5" />
        <circle cx="220" cy="235" r="2.0" opacity="0.6" />
        <circle cx="140" cy="125" r="1.8" opacity="0.5" />
        <circle cx="255" cy="180" r="2.0" opacity="0.65" />
        <circle cx="105" cy="180" r="1.6" opacity="0.45" />
        <circle cx="180" cy="105" r="1.9" opacity="0.55" />
        <circle cx="180" cy="255" r="2.1" opacity="0.65" />

        <!-- Distant rim points -->
        <circle cx="265" cy="160" r="1.5" opacity="0.4" />
        <circle cx="95" cy="200" r="1.4" opacity="0.35" />
        <circle cx="235" cy="250" r="1.6" opacity="0.45" />
        <circle cx="125" cy="110" r="1.4" opacity="0.35" />
        <circle cx="275" cy="190" r="1.5" opacity="0.4" />
        <circle cx="85" cy="170" r="1.3" opacity="0.3" />
        <circle cx="200" cy="85" r="1.5" opacity="0.4" />
        <circle cx="160" cy="275" r="1.7" opacity="0.5" />
        
        <!-- Scatter lattice -->
        <circle cx="225" cy="120" r="1.6" opacity="0.45" />
        <circle cx="135" cy="240" r="1.7" opacity="0.5" />
        <circle cx="250" cy="210" r="1.8" opacity="0.55" />
        <circle cx="110" cy="150" r="1.5" opacity="0.4" />
        <circle cx="160" cy="95" r="1.6" opacity="0.45" />
        <circle cx="200" cy="265" r="1.9" opacity="0.55" />
        <circle cx="150" cy="260" r="1.8" opacity="0.5" />
        <circle cx="210" cy="100" r="1.5" opacity="0.4" />
        <circle cx="270" cy="225" r="1.4" opacity="0.35" />
        <circle cx="90" cy="135" r="1.3" opacity="0.3" />
        <circle cx="190" cy="65" r="1.4" opacity="0.35" />
        <circle cx="170" cy="295" r="1.6" opacity="0.45" />
        <circle cx="285" cy="175" r="1.3" opacity="0.3" />
        <circle cx="75" cy="185" r="1.2" opacity="0.25" />
      </g>
    </g>
  </g>

  <!-- Bottom Divider & Footer -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#3C3428" stroke-width="1" />
    
    <!-- Footer Left -->
    <g transform="translate(0, 26)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#8399FF">▤</text>
      <text x="16" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#A89C89">My Subdomains</text>
      <text x="130" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#A89C89">·</text>
      <text x="145" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34D399">Anycast DNS Online</text>
    </g>

    <!-- Footer Right -->
    <g transform="translate(860, 26)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#A89C89">Terms</text>
      <text x="60" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#A89C89">Privacy</text>
      <text x="135" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#A89C89">GitHub</text>
    </g>
  </g>
</svg>
