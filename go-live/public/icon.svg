<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#09090b" />
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#27272a" stroke-width="1" />
  <!-- Signal radar rings -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.25" />
  <circle cx="16" cy="16" r="6" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Center live dot -->
  <circle cx="16" cy="16" r="3.2" fill="url(#gl-grad)" filter="url(#glow)" />
</svg>
